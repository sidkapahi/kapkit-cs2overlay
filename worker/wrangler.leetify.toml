# Cloudflare Worker config for the Leetify proxy.
#
# Deploy:   wrangler deploy --config wrangler.leetify.toml
# Add key:  wrangler secret put LEETIFY_KEY --config wrangler.leetify.toml
#           (optional — only raises rate limits; never commit the key)

name = "leetify-proxy"
main = "leetify-proxy.js"
compatibility_date = "2024-11-01"

# Workers Logs: keep request and console logs (Observability tab in the
# Cloudflare dashboard) — useful for seeing why an upstream API call failed.
[observability.logs]
enabled = true
invocation_logs = true
persist = true
