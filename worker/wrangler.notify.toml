# Cloudflare Worker config for the Discord build notifier.
#
# Create the queue first (the deploy fails if it doesn't exist):
#            wrangler queues create kapkit-build-events
# Deploy:    wrangler deploy --config wrangler.notify.toml
# Add creds: wrangler secret put DISCORD_WEBHOOK_CS2 --config wrangler.notify.toml  (one per project channel)
#            wrangler secret put DISCORD_USER_ID --config wrangler.notify.toml
#            (never commit the secrets)

name = "build-notify"
main = "build-notify.js"
compatibility_date = "2026-09-01"

# Workers Builds publishes the site Worker's build events to this queue (via an
# Event Subscription set up in the dashboard); this Worker consumes them.
[[queues.consumers]]
queue = "kapkit-build-events"
max_batch_size = 10
max_batch_timeout = 1 # seconds — deliver notifications promptly
max_retries = 5

# Workers Logs: keep request and console logs (Observability tab in the
# Cloudflare dashboard) — useful for seeing why a Discord post failed.
[observability.logs]
enabled = true
invocation_logs = true
persist = true
