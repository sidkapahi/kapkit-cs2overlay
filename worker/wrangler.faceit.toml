# Cloudflare Worker config for the FACEIT proxy.
#
# Deploy:   wrangler deploy --config wrangler.faceit.toml
# Add key:  wrangler secret put FACEIT_API_KEY --config wrangler.faceit.toml
#           (never commit the key)

name = "faceit-proxy"
main = "faceit-proxy.js"
compatibility_date = "2024-11-01"

# Workers Logs: keep request and console logs (Observability tab in the
# Cloudflare dashboard) — useful for seeing why an upstream API call failed.
[observability.logs]
enabled = true
invocation_logs = true
persist = true
