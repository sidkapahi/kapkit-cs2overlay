# Cloudflare Worker config for the YouTube live-status proxy.
#
# Deploy:    wrangler deploy --config wrangler.youtube.toml
# Add key:   wrangler secret put YOUTUBE_API_KEY --config wrangler.youtube.toml
#            (never commit the key)

name = "youtube-live-proxy"
main = "youtube-live-proxy.js"
compatibility_date = "2024-11-01"

# Workers Logs: keep request and console logs (Observability tab in the
# Cloudflare dashboard) — useful for seeing why an upstream API call failed.
[observability.logs]
enabled = true
invocation_logs = true
persist = true
