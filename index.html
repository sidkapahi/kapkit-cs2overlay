<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kapKit - CS2 Stats Overlay</title>
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Open Graph / social embed -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="kapKit">
  <meta property="og:title" content="kapKit - CS2 Stats Overlay">
  <meta property="og:description" content="A customizable CS2 stats overlay for your stream.">
  <meta property="og:url" content="https://cs2widget.kapkit.ca/">
  <meta property="og:image" content="https://cs2widget.kapkit.ca/og-image.png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="kapKit - CS2 Stats Overlay">
  <meta name="twitter:description" content="A customizable CS2 stats overlay for your stream.">
  <meta name="twitter:image" content="https://cs2widget.kapkit.ca/og-image.png">

  <!-- Analytics (PostHog) is initialized from src/shared/analytics.ts, only when
       VITE_POSTHOG_KEY is set (see .env.example), and only after the visitor
       accepts the cookie banner. Nothing is bundled or sent without a key. -->
</head>
<body>
  <div id="app"></div>
  <!-- Ad units, customizer only (the OBS overlay in widget/ never loads them).
       Wide screens float one in each gutter beside the layout; narrower
       screens show only the first, once below the page. Both frame the same
       unit (public/slots/unit.html). -->
  <aside class="ad-slot ad-slot--left" aria-label="Advertisement">
    <iframe src="/slots/unit.html" width="300" height="250" title="Advertisement" scrolling="no" loading="lazy"></iframe>
  </aside>
  <aside class="ad-slot ad-slot--right" aria-label="Advertisement">
    <iframe src="/slots/unit.html" width="300" height="250" title="Advertisement" scrolling="no" loading="lazy"></iframe>
  </aside>
  <script type="module" src="/src/customizer/customizer.ts"></script>
</body>
</html>
